name: Branch from upstream tag
on: workflow_dispatch
jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tag and push as branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TAG="7.4.3.132-ga132"
          NEW_BRANCH="u132-ce"
          mkdir work && cd work
          git init -q
          git remote add upstream https://github.com/liferay/liferay-portal.git
          git fetch --depth 1 upstream tag "${TAG}"
          git push "https://x-access-token:${GH_PAT}@github.com/arraysglobal-dev/liferay-portal.git" \
            "${TAG}^{commit}:refs/heads/${NEW_BRANCH}"
